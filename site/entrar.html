<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F2A47" />
    <meta name="description" content="Entre na sua conta do Inclui+." />
    <title>Entrar | Inclui+</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/boot.js"></script>
    <script type="module" src="assets/js/pages/entrar.js"></script>
  </head>
  <body data-page="entrar">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header" id="site-header" data-surface="dark"></header>

    <main id="conteudo" tabindex="-1">
      <div class="auth">
        <div class="auth-aside" data-surface="dark">
          <h2>Que bom ter você <span class="highlight">de volta.</span></h2>
          <ul>
            <li><i data-icon="check" data-size="18"></i> Resultados ordenados pela sua necessidade</li>
            <li><i data-icon="check" data-size="18"></i> Assistente que já sabe do que você precisa</li>
            <li><i data-icon="check" data-size="18"></i> Seus dados ficam só neste navegador</li>
          </ul>
        </div>
        <div class="auth-form-side">
          <div class="auth-box">
            <h1>Entrar</h1>
            <p class="auth-lead">Use o e-mail e a senha da sua conta.</p>
            <form class="form-stack" id="login-form" novalidate>
              <div id="form-alert"></div>
              <div class="field">
                <label for="email">E-mail</label>
                <input class="control" id="email" type="email" autocomplete="email" />
              </div>
              <div class="field">
                <label for="password">Senha</label>
                <div class="password-wrap">
                  <input class="control" id="password" type="password" autocomplete="current-password" />
                  <button type="button" class="password-toggle" data-password-toggle></button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary btn-l btn-block" id="submit">Entrar</button>
            </form>
            <p class="auth-foot">Ainda não tem conta? <a href="cadastro.html">Crie agora</a></p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
