name: Pipeline

# A cada push, em qualquer branch: build da imagem e as três varreduras de segurança.
# Na main, se as três passarem, o deploy na AWS roda sozinho.
on:
  push:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: gs
  TF_STATE_KEY: inclui-gs/terraform.tfstate

jobs:
  gitleaks:
    name: Gitleaks - segredos no código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico inteiro: um segredo apagado num commit antigo continua exposto.
          fetch-depth: 0

      - name: Varredura de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep - análise estática
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala o Semgrep
        run: pip install semgrep

      # Cobre o JavaScript, o Dockerfile, o Terraform e o próprio workflow.
      # O Leaflet é código de terceiros copiado para o projeto e fica de fora.
      - name: Varredura de código vulnerável
        run: semgrep scan --config auto --error --exclude site/assets/vendor

  build-e-trivy:
    name: Build e Trivy - CVE crítico na imagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t inclui:${{ github.sha }} .

      - name: Varredura de CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inclui:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    name: Deploy na AWS
    # Só sobe se as três varreduras passarem.
    needs: [gitleaks, semgrep, build-e-trivy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # O runner é descartável: o estado do Terraform precisa viver no S3,
      # senão cada execução tentaria recriar a infraestrutura inteira.
      # Idempotente: cria o bucket apenas na primeira vez.
      - name: Bootstrap do backend de estado
        run: |
          conta=$(aws sts get-caller-identity --query Account --output text)
          bucket="inclui-gs-tfstate-$conta"
          echo "TF_STATE_BUCKET=$bucket" >> "$GITHUB_ENV"

          if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            echo "Bucket de estado já existe."
          else
            echo "Criando o bucket de estado."
            aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
            aws s3api put-bucket-versioning \
              --bucket "$bucket" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block \
              --bucket "$bucket" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            aws s3api put-bucket-encryption \
              --bucket "$bucket" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

      - name: Setup do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      # Na primeira execução, o CloudFront leva alguns minutos para ficar pronto.
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

      - name: Lê os outputs da infraestrutura
        working-directory: infra
        run: |
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> "$GITHUB_ENV"
          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"
          echo "IP_PUBLICO=$(terraform output -raw ip_publico)" >> "$GITHUB_ENV"
          echo "URL_DO_SITE=$(terraform output -raw url_do_site)" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"

      - name: Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push no ECR
        run: |
          docker build -t "$ECR_URL:$IMAGE_TAG" -t "$ECR_URL:$GITHUB_SHA" .
          docker push --all-tags "$ECR_URL"

      # A instância pode ter acabado de nascer; o agente SSM leva um tempo
      # até se registrar. Sem esta espera o send-command falha por "instância
      # não encontrada" em provisionamentos novos.
      - name: Aguarda o agente SSM registrar a instância
        run: |
          for tentativa in $(seq 1 30); do
            estado=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "None")
            if [ "$estado" = "Online" ]; then
              echo "Agente SSM online."
              exit 0
            fi
            echo "Tentativa $tentativa: agente ainda não registrado."
            sleep 10
          done
          echo "::error::O agente SSM não ficou online em 5 minutos."
          exit 1

      - name: Deploy na EC2 via SSM
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters '{"commands":["cloud-init status --wait || true","/usr/local/bin/deploy.sh"]}' \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Saida:StandardOutputContent,Erro:StandardErrorContent}' \
            --output json

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          [ "$status" = "Success" ] || { echo "::error::Deploy falhou com status $status"; exit 1; }

      # Os assets ficam até 1 hora no cache do CloudFront: limpa para o deploy valer já.
      - name: Limpa o cache do CloudFront
        if: env.CLOUDFRONT_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Confirma o site no ar
        run: |
          for tentativa in $(seq 1 24); do
            if curl -fsS "$URL_DO_SITE/healthz" >/dev/null; then
              {
                echo "### Inclui+ no ar"
                echo ""
                echo "- URL: $URL_DO_SITE"
                echo "- Imagem: \`$ECR_URL:$IMAGE_TAG\`"
                echo "- Commit: \`$GITHUB_SHA\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::O site não respondeu em $URL_DO_SITE"
          exit 1
