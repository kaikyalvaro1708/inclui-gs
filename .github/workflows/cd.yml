name: CD

# Só implanta depois que o Security Pipeline (Gitleaks, Semgrep e Trivy) passar na main.
# Se alguma varredura falhar, o deploy não acontece.
on:
  workflow_run:
    workflows: [Security Pipeline]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-inclui
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_STATE_KEY: inclui-gs/terraform.tfstate

jobs:
  entregar:
    name: Provisiona, publica e implanta
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # O mesmo commit que passou nas varreduras de segurança.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Define a tag da imagem
        run: echo "IMAGE_TAG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # O runner é descartável: o estado do Terraform precisa viver no S3,
      # senão cada execução tentaria recriar a infraestrutura inteira.
      # Idempotente: cria o bucket apenas na primeira vez.
      - name: Bootstrap do backend de estado
        run: |
          conta=$(aws sts get-caller-identity --query Account --output text)
          bucket="inclui-gs-tfstate-$conta"
          echo "TF_STATE_BUCKET=$bucket" >> "$GITHUB_ENV"

          if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            echo "Bucket de estado já existe."
          else
            echo "Criando o bucket de estado."
            aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
            aws s3api put-bucket-versioning \
              --bucket "$bucket" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block \
              --bucket "$bucket" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            aws s3api put-bucket-encryption \
              --bucket "$bucket" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

      - name: Setup do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      # Na primeira execução, o CloudFront leva alguns minutos para ficar pronto.
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

      - name: Lê os outputs da infraestrutura
        working-directory: infra
        run: |
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> "$GITHUB_ENV"
          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"
          echo "URL_DO_SITE=$(terraform output -raw url_do_site)" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"

      - name: Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # As tags do ECR são imutáveis: cada imagem leva o SHA do commit.
      # Se o deploy for repetido para o mesmo commit, a imagem já existe e o push é pulado.
      - name: Build e push no ECR
        run: |
          repositorio="${ECR_URL##*/}"
          if aws ecr describe-images --repository-name "$repositorio" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Imagem $IMAGE_TAG já está no ECR."
          else
            docker build -t "$ECR_URL:$IMAGE_TAG" .
            docker push "$ECR_URL:$IMAGE_TAG"
          fi

      # A instância pode ter acabado de nascer; o agente SSM leva um tempo
      # até se registrar. Sem esta espera o send-command falha por "instância
      # não encontrada" em provisionamentos novos.
      - name: Aguarda o agente SSM registrar a instância
        run: |
          for tentativa in $(seq 1 30); do
            estado=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "None")
            if [ "$estado" = "Online" ]; then
              echo "Agente SSM online."
              exit 0
            fi
            echo "Tentativa $tentativa: agente ainda não registrado."
            sleep 10
          done
          echo "::error::O agente SSM não ficou online em 5 minutos."
          exit 1

      - name: Deploy na EC2 via SSM
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG" \
            --parameters "{\"commands\":[\"cloud-init status --wait || true\",\"/usr/local/bin/deploy.sh $IMAGE_TAG\"]}" \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Saida:StandardOutputContent,Erro:StandardErrorContent}' \
            --output json

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          [ "$status" = "Success" ] || { echo "::error::Deploy falhou com status $status"; exit 1; }

      # Os assets ficam até 1 hora no cache do CloudFront: limpa para o deploy valer já.
      - name: Limpa o cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Confirma o site no ar
        run: |
          for tentativa in $(seq 1 24); do
            if curl -fsS "$URL_DO_SITE/healthz" >/dev/null; then
              {
                echo "### Inclui+ no ar"
                echo ""
                echo "- URL: $URL_DO_SITE"
                echo "- Imagem: \`$ECR_URL:$IMAGE_TAG\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::O site não respondeu em $URL_DO_SITE"
          exit 1
