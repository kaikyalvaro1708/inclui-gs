name: CI — Build e Segurança

# Testa tudo antes de chegar na main: build da imagem, Gitleaks, Semgrep e Trivy.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build — Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Monta a imagem
        run: docker build -t inclui:ci .

  gitleaks:
    name: Gitleaks — Segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Histórico inteiro: um segredo apagado num commit antigo continua exposto.
          fetch-depth: 0

      # CLI oficial em container, versão fixa, varrendo todos os commits.
      # (A gitleaks-action quebra quando a varredura começa no primeiro commit do repositório.)
      - name: Procura segredos em todo o histórico
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  semgrep:
    name: Semgrep — Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Instala o Semgrep
        run: pip install semgrep

      # O Leaflet é código de terceiros copiado para o projeto e fica de fora.
      - name: Revisa o código
        run: semgrep scan --config auto --error --exclude site/assets/vendor

  trivy:
    name: Trivy — Imagem
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Monta a imagem
        run: docker build -t inclui:security-scan .

      - name: Checa vulnerabilidades críticas
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: inclui:security-scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
