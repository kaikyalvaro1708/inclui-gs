name: CI/CD

# Esteira CI/CD do Inclui+.
#   CI, a cada push em qualquer branch: build da imagem e as três varreduras de segurança
#      (Gitleaks, Semgrep e Trivy). Qualquer achado deixa a execução vermelha.
#   CD, só na main e só se o CI inteiro passar: Terraform, push no ECR e deploy na EC2.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_STATE_KEY: inclui-gs/terraform.tfstate

jobs:
  # ---------------------------------------------------------------- CI
  gitleaks:
    name: CI - Gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Histórico inteiro: um segredo apagado num commit antigo continua exposto.
          fetch-depth: 0

      # A CLI oficial em container, versão fixa. Varre todos os commits do repositório.
      # As variáveis GIT_CONFIG_* marcam a pasta montada como segura para o git do container.
      - name: Varredura de segredos em todo o histórico
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  semgrep:
    name: CI - Semgrep (análise estática)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instala o Semgrep
        run: pip install semgrep

      # Cobre o JavaScript, o Dockerfile, o docker-compose, o Terraform, o nginx e este workflow.
      # O Leaflet é código de terceiros copiado para o projeto e fica de fora.
      - name: Varredura de código vulnerável
        run: semgrep scan --config auto --exclude site/assets/vendor --json --output semgrep.json

      # Cada achado vira uma anotação na execução, com arquivo e linha.
      - name: Bloqueia se houver achado
        run: |
          total=$(jq '.results | length' semgrep.json)
          jq -r '.results[] | "::error file=\(.path),line=\(.start.line),title=\(.check_id | split(".") | last)::\(.extra.message | gsub("\n"; " ") | .[0:400])"' semgrep.json
          echo "Semgrep: $total achado(s)."
          [ "$total" -eq 0 ]

  build-e-trivy:
    name: CI - Build e Trivy (CVE crítico)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build da imagem
        run: docker build -t "inclui:$GITHUB_SHA" .

      - name: Varredura de CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inclui:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"

      # Cada CVE crítico com correção disponível vira uma anotação e barra a esteira.
      - name: Bloqueia se houver CVE crítico
        run: |
          total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          jq -r '.Results[]? | .Target as $alvo | .Vulnerabilities[]? | "::error title=\(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion), corrigido em \(.FixedVersion) (\($alvo))"' trivy.json
          echo "Trivy: $total CVE(s) crítico(s) com correção disponível."
          [ "$total" -eq 0 ]

  # ---------------------------------------------------------------- CD
  deploy:
    name: CD - Deploy na AWS
    needs: [gitleaks, semgrep, build-e-trivy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # O runner é descartável: o estado do Terraform precisa viver no S3,
      # senão cada execução tentaria recriar a infraestrutura inteira.
      # Idempotente: cria o bucket apenas na primeira vez.
      - name: Bootstrap do backend de estado
        run: |
          conta=$(aws sts get-caller-identity --query Account --output text)
          bucket="inclui-gs-tfstate-$conta"
          echo "TF_STATE_BUCKET=$bucket" >> "$GITHUB_ENV"

          if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            echo "Bucket de estado já existe."
          else
            echo "Criando o bucket de estado."
            aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
            aws s3api put-bucket-versioning \
              --bucket "$bucket" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block \
              --bucket "$bucket" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            aws s3api put-bucket-encryption \
              --bucket "$bucket" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

      - name: Setup do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      # Na primeira execução, o CloudFront leva alguns minutos para ficar pronto.
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

      - name: Lê os outputs da infraestrutura
        working-directory: infra
        run: |
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> "$GITHUB_ENV"
          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"
          echo "URL_DO_SITE=$(terraform output -raw url_do_site)" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"

      - name: Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # As tags do ECR são imutáveis: cada imagem leva o SHA do commit e nunca é sobrescrita.
      # Se a execução for repetida para o mesmo commit, a imagem já existe e o push é pulado.
      - name: Build e push no ECR
        run: |
          repositorio="${ECR_URL##*/}"
          if aws ecr describe-images --repository-name "$repositorio" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Imagem $GITHUB_SHA já está no ECR."
          else
            docker build -t "$ECR_URL:$GITHUB_SHA" .
            docker push "$ECR_URL:$GITHUB_SHA"
          fi

      # A instância pode ter acabado de nascer; o agente SSM leva um tempo
      # até se registrar. Sem esta espera o send-command falha por "instância
      # não encontrada" em provisionamentos novos.
      - name: Aguarda o agente SSM registrar a instância
        run: |
          for tentativa in $(seq 1 30); do
            estado=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "None")
            if [ "$estado" = "Online" ]; then
              echo "Agente SSM online."
              exit 0
            fi
            echo "Tentativa $tentativa: agente ainda não registrado."
            sleep 10
          done
          echo "::error::O agente SSM não ficou online em 5 minutos."
          exit 1

      - name: Deploy na EC2 via SSM
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "{\"commands\":[\"cloud-init status --wait || true\",\"/usr/local/bin/deploy.sh $GITHUB_SHA\"]}" \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Saida:StandardOutputContent,Erro:StandardErrorContent}' \
            --output json

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          [ "$status" = "Success" ] || { echo "::error::Deploy falhou com status $status"; exit 1; }

      # Os assets ficam até 1 hora no cache do CloudFront: limpa para o deploy valer já.
      - name: Limpa o cache do CloudFront
        if: env.CLOUDFRONT_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Confirma o site no ar
        run: |
          for tentativa in $(seq 1 24); do
            if curl -fsS "$URL_DO_SITE/healthz" >/dev/null; then
              {
                echo "### Inclui+ no ar"
                echo ""
                echo "- URL: $URL_DO_SITE"
                echo "- Imagem: \`$ECR_URL:$GITHUB_SHA\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::O site não respondeu em $URL_DO_SITE"
          exit 1
