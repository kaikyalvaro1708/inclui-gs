name: Security Pipeline

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks - detecção de segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Histórico inteiro: um segredo apagado num commit antigo continua exposto.
          fetch-depth: 0

      # CLI oficial em container, versão fixa, varrendo todos os commits.
      # (A gitleaks-action quebra quando a varredura começa no primeiro commit do repositório.)
      - name: Varredura de segredos
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  semgrep:
    name: Semgrep - análise estática de código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instala o Semgrep
        run: pip install semgrep

      # O Leaflet é código de terceiros copiado para o projeto e fica de fora.
      - name: Varredura de código vulnerável
        run: semgrep scan --config auto --error --exclude site/assets/vendor

  trivy:
    name: Trivy - CVE crítico na imagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build da imagem
        run: docker build -t inclui:security-scan .

      - name: Varredura de CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inclui:security-scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
