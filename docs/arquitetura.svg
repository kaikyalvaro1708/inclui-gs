<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1870 1030" width="1870" height="1030" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#16243f"/>
    </marker>
  </defs>

  <rect width="1870" height="1030" fill="#ffffff"/>

  <!-- titulo -->
  <rect x="600" y="20" width="670" height="68" rx="12" fill="#16243f"/>
  <text x="935" y="66" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">Inclui+ — Arquitetura da Solução</text>

  <!-- ===================== VISITANTE ===================== -->
  <rect x="25" y="480" width="135" height="145" rx="12" fill="#f4f7fb" stroke="#16243f" stroke-width="2"/>
  <circle cx="92" cy="528" r="19" fill="#16243f"/>
  <path d="M 65 575 C 65 548 119 548 119 575 Z" fill="#16243f"/>
  <text x="92" y="608" text-anchor="middle" font-size="19" font-weight="700" fill="#16243f">Visitante</text>

  <line x1="160" y1="552" x2="252" y2="552" stroke="#16243f" stroke-width="3" marker-end="url(#a)"/>
  <text x="204" y="538" text-anchor="middle" font-size="16" font-weight="600" fill="#16243f">HTTPS</text>

  <!-- ===================== AWS ===================== -->
  <rect x="235" y="130" width="1030" height="710" rx="14" fill="#f8fafc" stroke="#16243f" stroke-width="2"/>
  <rect x="237" y="132" width="1026" height="60" fill="#16243f"/>
  <text x="262" y="174" font-size="30" font-weight="700" fill="#ff9900">aws</text>
  <line x1="345" y1="144" x2="345" y2="180" stroke="#8ba0c0" stroke-width="2"/>
  <text x="365" y="172" font-size="22" font-weight="600" fill="#ffffff">AWS — região us-east-2</text>

  <!-- VPC: so o security group e a EC2 ficam dentro -->
  <rect x="450" y="250" width="560" height="520" rx="10" fill="#eef4ff" fill-opacity="0.5" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="10 7"/>
  <rect x="472" y="272" width="22" height="22" rx="5" fill="#2563eb"/>
  <text x="504" y="290" font-size="17" font-weight="700" fill="#2563eb">VPC 10.0.0.0/24 — sub-rede pública</text>

  <!-- CloudFront: FORA da VPC, dentro da AWS -->
  <rect x="258" y="490" width="154" height="140" rx="12" fill="#ffffff" stroke="#16243f" stroke-width="2"/>
  <rect x="308" y="503" width="54" height="54" rx="12" fill="#8c4fff"/>
  <circle cx="335" cy="530" r="17" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <ellipse cx="335" cy="530" rx="7" ry="17" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="318" y1="530" x2="352" y2="530" stroke="#ffffff" stroke-width="2.5"/>
  <text x="335" y="589" text-anchor="middle" font-size="19" font-weight="700" fill="#16243f">CloudFront</text>
  <text x="335" y="611" text-anchor="middle" font-size="13" fill="#5b6b85">serviço global de borda</text>

  <!-- CloudFront -> security group: cruza a borda da VPC -->
  <line x1="412" y1="545" x2="475" y2="545" stroke="#16243f" stroke-width="3" marker-end="url(#a)"/>
  <text x="444" y="531" text-anchor="middle" font-size="16" font-weight="600" fill="#16243f">HTTP 80</text>

  <!-- security group -->
  <path d="M 515 503 L 549 517 L 549 549 C 549 573 533 588 515 595 C 497 588 481 573 481 549 L 481 517 Z" fill="#2563eb"/>
  <path d="M 504 545 L 512 554 L 528 535" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="515" y="621" text-anchor="middle" font-size="15" font-weight="700" fill="#16243f">Security group:</text>
  <text x="515" y="641" text-anchor="middle" font-size="15" font-weight="700" fill="#16243f">só porta 80 —</text>
  <text x="515" y="661" text-anchor="middle" font-size="15" font-weight="700" fill="#16243f">sem SSH</text>

  <line x1="549" y1="545" x2="594" y2="545" stroke="#16243f" stroke-width="3" marker-end="url(#a)"/>

  <!-- EC2 -->
  <rect x="600" y="330" width="385" height="270" rx="12" fill="#ffffff" stroke="#16243f" stroke-width="2"/>
  <rect x="618" y="346" width="32" height="32" rx="7" fill="#ff9900"/>
  <text x="810" y="369" text-anchor="middle" font-size="18" font-weight="700" fill="#16243f">EC2 t3.micro — Amazon Linux 2023</text>
  <rect x="628" y="420" width="329" height="110" rx="10" fill="#eef2f7" stroke="#b9c6d8" stroke-width="1.5"/>
  <text x="792" y="466" text-anchor="middle" font-size="18" font-weight="700" fill="#16243f">Container nginx</text>
  <text x="792" y="493" text-anchor="middle" font-size="16" fill="#334a66">sem root, porta 8080</text>

  <!-- ECR: FORA da VPC -->
  <rect x="1045" y="400" width="205" height="90" rx="12" fill="#ffffff" stroke="#16243f" stroke-width="2"/>
  <rect x="1065" y="420" width="50" height="50" rx="10" fill="#ff9900"/>
  <path d="M 1077 437 L 1090 430 L 1103 437 L 1103 453 L 1090 460 L 1077 453 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="1185" y="451" text-anchor="middle" font-size="17" font-weight="700" fill="#16243f">Amazon ECR</text>

  <!-- S3: FORA da VPC -->
  <rect x="1045" y="560" width="205" height="100" rx="12" fill="#ffffff" stroke="#16243f" stroke-width="2"/>
  <rect x="1065" y="585" width="50" height="50" rx="10" fill="#3f8624"/>
  <path d="M 1078 597 L 1102 597 L 1098 623 L 1082 623 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="1185" y="603" text-anchor="middle" font-size="17" font-weight="700" fill="#16243f">Amazon S3</text>
  <text x="1185" y="626" text-anchor="middle" font-size="14" fill="#5b6b85">estado do Terraform</text>

  <!-- ECR -> EC2: entra na VPC -->
  <polyline points="1045,445 1018,445 1018,300 860,300 860,324" fill="none" stroke="#16243f" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="936" y="289" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">pull via IAM role</text>

  <!-- ===================== GITHUB ACTIONS ===================== -->
  <rect x="1390" y="180" width="450" height="560" rx="14" fill="#ffffff" stroke="#1b1f23" stroke-width="2"/>
  <circle cx="1450" cy="235" r="26" fill="#1b1f23"/>
  <path d="M 1442 224 L 1442 246" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1442 237 C 1442 229 1461 233 1461 226" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1442" cy="222" r="4.5" fill="#ffffff"/>
  <circle cx="1442" cy="248" r="4.5" fill="#ffffff"/>
  <circle cx="1461" cy="223" r="4.5" fill="#ffffff"/>
  <text x="1655" y="230" text-anchor="middle" font-size="25" font-weight="700" fill="#1b1f23">GitHub Actions</text>
  <text x="1655" y="258" text-anchor="middle" font-size="18" font-weight="600" fill="#6b7785">CI/CD</text>

  <rect x="1410" y="290" width="410" height="110" rx="9" fill="#16243f"/>
  <text x="1615" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">ci.yml — Pull Request</text>
  <rect x="1422" y="334" width="92" height="46" rx="7" fill="#e8eef7"/><text x="1468" y="363" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">Build</text>
  <rect x="1520" y="334" width="92" height="46" rx="7" fill="#e8eef7"/><text x="1566" y="363" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">Gitleaks</text>
  <rect x="1618" y="334" width="92" height="46" rx="7" fill="#e8eef7"/><text x="1664" y="363" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">Semgrep</text>
  <rect x="1716" y="334" width="92" height="46" rx="7" fill="#e8eef7"/><text x="1762" y="363" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">Trivy</text>

  <line x1="1510" y1="400" x2="1510" y2="434" stroke="#16243f" stroke-width="3" marker-end="url(#a)"/>
  <text x="1527" y="425" font-size="15" font-weight="600" fill="#16243f">merge aprovado</text>

  <rect x="1410" y="440" width="410" height="270" rx="9" fill="#16243f"/>
  <text x="1615" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">cd.yml — Push na main</text>
  <rect x="1430" y="490" width="370" height="46" rx="7" fill="#e8eef7"/><text x="1615" y="519" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">terraform apply</text>
  <rect x="1430" y="552" width="370" height="46" rx="7" fill="#e8eef7"/><text x="1615" y="581" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">docker build + push</text>
  <rect x="1430" y="614" width="370" height="46" rx="7" fill="#e8eef7"/><text x="1615" y="643" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">SSM Send-Command</text>

  <!-- cd.yml -> ECR -->
  <line x1="1390" y1="445" x2="1256" y2="445" stroke="#16243f" stroke-width="3" marker-end="url(#a)"/>
  <text x="1323" y="430" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">docker push</text>

  <!-- cd.yml -> S3 -->
  <line x1="1390" y1="610" x2="1256" y2="610" stroke="#16243f" stroke-width="3" marker-end="url(#a)"/>
  <text x="1323" y="595" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">terraform apply</text>

  <!-- cd.yml -> EC2 via SSM -->
  <polyline points="1390,705 790,705 790,606" fill="none" stroke="#16243f" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="1085" y="692" text-anchor="middle" font-size="15" font-weight="700" fill="#16243f">deploy via SSM (sem SSH)</text>

  <!-- ===================== MONITORAMENTO ===================== -->
  <rect x="430" y="880" width="580" height="130" rx="12" fill="#ffffff" stroke="#16243f" stroke-width="2"/>
  <rect x="432" y="882" width="576" height="48" fill="#16243f"/>
  <text x="720" y="914" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Monitoramento</text>
  <rect x="455" y="943" width="265" height="52" rx="9" fill="#eef2f7"/>
  <circle cx="488" cy="969" r="16" fill="#e6522c"/>
  <text x="608" y="964" text-anchor="middle" font-size="14" font-weight="600" fill="#16243f">Prometheus +</text>
  <text x="608" y="982" text-anchor="middle" font-size="14" font-weight="600" fill="#16243f">Blackbox Exporter</text>
  <line x1="726" y1="969" x2="756" y2="969" stroke="#16243f" stroke-width="3" marker-end="url(#a)"/>
  <rect x="762" y="943" width="223" height="52" rx="9" fill="#eef2f7"/>
  <circle cx="795" cy="969" r="16" fill="#f46800"/>
  <text x="885" y="975" text-anchor="middle" font-size="16" font-weight="600" fill="#16243f">Grafana</text>

  <polyline points="560,880 335,880 335,636" fill="none" stroke="#16243f" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="452" y="866" text-anchor="middle" font-size="15" font-weight="600" fill="#16243f">mede latência e erros</text>
</svg>
