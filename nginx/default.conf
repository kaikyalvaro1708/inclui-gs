# Configuração do nginx dentro do container do Inclui+.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não anuncia a versão do nginx nas respostas nem nas páginas de erro.
    server_tokens off;

    # Cabeçalhos de segurança. Valem para todas as respostas, porque nenhum location
    # abaixo usa add_header (no nginx, um add_header no location apagaria estes).
    #   script-src 'self': todo JavaScript é arquivo do próprio site, nada inline.
    #   style-src 'unsafe-inline': algumas larguras (barras de nota) usam style inline.
    #   img-src: os blocos do mapa vêm do OpenStreetMap.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # "Perto de mim" usa a localização; câmera e microfone nunca.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # Ignorado em HTTP; vale quando o site é acessado pelo CloudFront, em HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # HTML sempre revalidado: um deploy novo aparece na hora.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # CSS, JS, fontes e imagens não têm hash no nome, então o cache é curto.
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    # Usado pelo HEALTHCHECK do Docker e pelo pipeline.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
